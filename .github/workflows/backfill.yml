name: Backfill historique qualité de l'air

on:
  workflow_dispatch:
    inputs:
      months:
        description: "Nombre de mois d'historique à récupérer (12 idéal, 3 minimum)"
        required: true
        default: "12"

permissions:
  contents: write

jobs:
  run-backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: pip install -r scripts/requirements-ci.txt

      - name: Lancer le backfill
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          PG_HOST: ${{ secrets.PG_HOST }}
          PG_PORT: ${{ secrets.PG_PORT }}
          PG_DB: ${{ secrets.PG_DB }}
          PG_USER: ${{ secrets.PG_USER }}
          PG_PASSWORD: ${{ secrets.PG_PASSWORD }}
        run: python scripts/run_backfill.py --months ${{ github.event.inputs.months }}

      - name: Commit et push des données (raw/ + clean/)
        run: |
          git config user.name "air-quality-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/raw data/clean
          git diff --cached --quiet || git commit -m "chore(data): backfill historique (${{ github.event.inputs.months }} mois)"
          git push
